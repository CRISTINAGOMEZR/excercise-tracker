name: claude-daily

# Corrida diaria autónoma. El agente pm elige UN foco, hace el trabajo y abre
# como máximo un PR. Los cambios visibles quedan esperando aprobación de Cristina.
#
# Requisitos (una sola vez):
#   1. App de GitHub de Claude instalada: https://github.com/apps/claude
#   2. Secret ANTHROPIC_API_KEY en Settings → Secrets and variables → Actions
#
# Para probar sin esperar al cron: pestaña Actions → claude-daily → Run workflow.

on:
  schedule:
    # 11:17 UTC ≈ 08:17 en Chile. Minuto no redondo a propósito: a las :00 el
    # scheduler de GitHub está saturado y las corridas se retrasan.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-4-8
            --max-turns 40
          prompt: |
            Eres el sistema de mantenimiento autónomo del exercise tracker de Cristina.
            Lee `CLAUDE.md` en la raíz del repo antes de nada: tiene el stack, el mapa de
            archivos, las trampas conocidas y el backlog. **Respétalo.**

            ## Tu trabajo hoy

            1. Invoca al agente `pm` (está en `.claude/agents/pm.md`) para que elija
               **UN SOLO foco** para esta corrida. Que revise el backlog del `CLAUDE.md`,
               los commits recientes (`git log --oneline -15`) y el estado del repo.
               Opciones de foco: cazar bugs, accesibilidad, dependencias y seguridad,
               tests, o limpieza. El `pm` decide cuál aporta más hoy.

            2. Invoca al agente especialista de ese foco (`bug-hunter`, `ui-reviewer`,
               `deps-security` o `test-quality`) para que haga el trabajo.

            3. El `pm` revisa el resultado y descarta lo que no vale la pena.

            ## Reglas duras

            - **Máximo UN pull request por corrida.** Si no hay nada que valga un PR,
              no abras ninguno y termina diciendo por qué. Un día sin PR es un
              resultado válido — mejor eso que ruido.
            - **Nunca commitees a `main`.** Rama con prefijo `claude/<tipo>-<desc>`.
            - **`npm run build` tiene que pasar** antes de abrir el PR. Si no pasa,
              no abras el PR.
            - **No añadas dependencias nuevas.**
            - **No toques** reglas de Firestore, variables de entorno, ni nada bajo
              `app/api/`. Si encuentras un problema ahí, abre un issue en vez de un PR.

            ## Nivel de riesgo del PR

            Clasifica el trabajo y ponlo en el título del PR:

            - 🟢 typos, dependencias patch/minor, código muerto, lint, tests nuevos,
              accesibilidad que no cambia el layout (aria-label, alt, contraste a AA),
              bugs evidentes con fix de pocas líneas.
              Condiciones: build en verde, < 150 líneas, sin dependencias nuevas,
              sin tocar auth ni datos. **Si se cumplen todas, puedes mergear tú.**
            - 🟡 cualquier cambio visible de UI, features, refactors, deps major,
              o > 150 líneas. **Abre el PR y NO lo mergees.** Cristina decide.

            Ante la duda entre 🟢 y 🟡, es 🟡. Equivocarse hacia esperar aprobación
            es barato; equivocarse hacia mergear solo, no.

            ## Cuerpo del PR

            En español, con: qué cambió (una frase), por qué, nivel de riesgo, y qué
            probaste. Si tocaste UI, describe qué pantalla y en qué viewport.
