name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Nota: no se corre `npm run lint`. ESLint no está configurado en este
      # proyecto todavía y `next lint` abre un prompt interactivo que colgaría
      # el job. Añadir el step cuando exista un eslint.config.
      # Las NEXT_PUBLIC_* de Firebase se leen en tiempo de build. Son claves de
      # cliente (públicas por diseño), pero aquí van valores dummy: este job solo
      # verifica que el proyecto compila, no que conecta con Firebase.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: dummy
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: dummy
